<style>
  :root {
    --navy: #1F4E79;
    --blue: #2E75B6;
    --bg: #EEF1F5;
    --panel: #FFFFFF;
    --border: #D5D9E0;
    --text: #26282B;
    --grey: #8A8F98;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }
  #sidebar {
    width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 24px 18px;
    flex-shrink: 0;
  }
  #sidebar h1 {
    font-size: 18px;
    color: var(--navy);
    margin: 0 0 4px;
  }
  #sidebar .subtitle {
    font-size: 12px;
    color: var(--grey);
    margin-bottom: 22px;
    line-height: 1.5;
  }
  .nav-group { margin-bottom: 18px; }
  .nav-group-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--grey);
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    margin-bottom: 6px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .nav-btn:hover { background: #F2F5F9; }
  .nav-btn.active {
    background: #EAF1FA;
    border-color: var(--blue);
    color: var(--blue);
    font-weight: 700;
  }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .phone-shell {
    background: #111318;
    border-radius: 36px;
    padding: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .screen-viewport {
    width: 360px;
    height: 760px;
    border-radius: 22px;
    overflow: hidden;
    position: relative;
    background: white;
  }
  .screen { display: none; width: 360px; height: 760px; }
  .screen.active { display: block; }
  .screen svg { display: block; width: 360px; height: 760px; }
  #hint {
    position: fixed;
    bottom: 18px;
    left: 300px;
    right: 20px;
    text-align: center;
    font-size: 12px;
    color: var(--grey);
  }
</style>
</head>
